name: SentinelStack CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------------
  # JOB 1: Code Quality & Testing
  # Docker Hub login happens before container pulls to avoid rate-limits.
  # -------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start service containers (Postgres + Redis)
        run: |
          docker network create sentinel_ci || true

          docker run -d --name ci_postgres --network sentinel_ci \
            -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_DB=sentinel_test \
            -p 5432:5432 \
            postgres:15-alpine

          docker run -d --name ci_redis --network sentinel_ci \
            -p 6379:6379 \
            redis:7-alpine

          # Wait for postgres
          for i in $(seq 1 20); do
            docker exec ci_postgres pg_isready -U test_user && break
            echo "Waiting for postgres... ($i/20)"
            sleep 3
          done

          # Wait for redis
          for i in $(seq 1 10); do
            docker exec ci_redis redis-cli ping | grep -q PONG && break
            echo "Waiting for redis... ($i/10)"
            sleep 2
          done

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests
        env:
          ENV: test
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/sentinel_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key
        run: |
          alembic upgrade head
          pytest

      - name: Stop service containers
        if: always()
        run: |
          docker stop ci_postgres ci_redis || true
          docker rm ci_postgres ci_redis || true

  # -------------------------------------------------------------------
  # JOB 2: Docker Image Build Verification
  # -------------------------------------------------------------------
  docker-build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build . --file Dockerfile --tag sentinelstack:latest

  # -------------------------------------------------------------------
  # JOB 3: Performance Benchmark (k6)
  # -------------------------------------------------------------------
  benchmark:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run k6 local benchmark
        run: |
          docker compose -f docker-compose.prod.yml up -d
          sleep 10
          docker run --network host -v "${PWD}:/src" -w /src \
            grafana/k6 run benchmarks/k6_benchmark_script.js \
            --env TARGET_RPM=1000 \
            --env BASE_URL=http://localhost:8000